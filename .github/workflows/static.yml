name: Build and deploy wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/WeddingInvitation/WeddingInvitation.csproj -c Release -o publish

      - name: Set GitHub Pages base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          base = os.environ.get('BASE_PATH', '').rstrip('/') + '/'
          index = Path('publish/wwwroot/index.html')
          content = index.read_text(encoding='utf-8')
          marker = '<base href="/" />'
          if content.count(marker) != 1:
              raise SystemExit('Expected exactly one root base tag in the published index.')
          index.write_text(content.replace(marker, f'<base href="{html.escape(base, quote=True)}" />'), encoding='utf-8')
          Path('publish/wwwroot/.nojekyll').touch()
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
