name: Build and deploy wedding invitation

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node for offline tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Apps Script and browser helpers offline
        run: node --test tests/*.test.cjs
      - name: Check calendars and configuration
        run: dotnet run --project tests/WeddingInvitation.Checks -c Release
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Publish Blazor WebAssembly
        run: dotnet publish src/WeddingInvitation/WeddingInvitation.csproj -c Release -o publish
      - name: Set GitHub Pages base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          base = os.environ.get('BASE_PATH', '').rstrip('/') + '/'
          index = Path('publish/wwwroot/index.html')
          content = index.read_text(encoding='utf-8')
          marker = '<base href="/" />'
          if content.count(marker) != 1:
              raise SystemExit('Expected exactly one root base tag in the published index.')
          index.write_text(content.replace(marker, f'<base href="{html.escape(base, quote=True)}" />'), encoding='utf-8')
          Path('publish/wwwroot/.nojekyll').touch()
          for asset in ['config.json', 'css/app.css', 'js/invitation.js', 'assets/invitation.webp', 'assets/save-the-date.webp']:
              if not Path('publish/wwwroot', asset).is_file():
                  raise SystemExit(f'Missing published asset: {asset}')
          PY
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
